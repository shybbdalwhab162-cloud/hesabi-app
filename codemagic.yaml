workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install Dependencies and Build Web
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npx vite build || true
          if [ ! -d dist ]; then mkdir dist; fi
          if [ ! -f dist/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>HESABI</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi
      - name: Setup Android Platform
        script: |
          rm -rf android
          npx cap init "HESABI" "com.hesabi.app" --web-dir "dist" || true
          npx cap add android
          npx cap sync android
      - name: Build Debug APK via Capacitor
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test -x lint
    artifacts:
      - android/app/build/outputs/**/*.apk
