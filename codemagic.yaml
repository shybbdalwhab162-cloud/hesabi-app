workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Prepare Project and Web Assets
        script: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          mkdir -p dist
          npx vite build || true
          if [ ! -f dist/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>HESABI</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi
      - name: Generate and Sync Android Project
        script: |
          rm -rf android
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"com.hesabi.app","appName":"HESABI","webDir":"dist"}' > capacitor.config.json
          fi
          npx cap add android
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/apk/**/*.apk
