workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
      - name: Build Web Assets
        script: |
          npx vite build || npm run build --if-present
          mkdir -p dist
      - name: Setup Capacitor & Add Android
        script: |
          npx cap init "HESABI" "com.hesabi.app" --web-dir dist || true
          npx cap add android
          npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
