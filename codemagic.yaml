workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Prepare Root Configuration
        script: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
      - name: Build Web Assets
        script: |
          mkdir -p dist
          npx vite build || echo "Vite build skipped"
          if [ ! -f dist/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>HESABI</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi
      - name: Setup Capacitor Android
        script: |
          rm -rf android
          if [ ! -f capacitor.config.json ]; then
            npx cap init "HESABI" "com.hesabi.app" --web-dir "dist"
          fi
          npx cap add android
          npx cap sync android
      - name: Build Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
